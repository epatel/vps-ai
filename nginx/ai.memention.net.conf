server {
    server_name ai.memention.net;

    location /scramble {
        alias /home/epatel/vps-ai/projects/scramble/;
        index index.html;
    }

    location /badge {
        alias /home/epatel/vps-ai/projects/badge/;
        index index.html;
    }

    location /emoji-mixer {
        alias /home/epatel/vps-ai/projects/emoji-mixer/;
        index index.html;
    }

    location /breakout {
        alias /home/epatel/vps-ai/projects/breakout/;
        index index.html;
    }

    location /bellman/ {
        alias /home/epatel/vps-ai/projects/bellman/;
        index index.html;
        try_files $uri $uri/ /bellman/index.html;
    }

    location /flutter_demo {
        alias /home/epatel/vps-ai/projects/flutter_demo/build/web;
        index index.html;
        try_files $uri $uri/ /flutter_demo/index.html;
    }

    location /status {
        proxy_pass http://127.0.0.1:5001/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Allow iframe embedding
        add_header X-Frame-Options "" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /webhook {
        proxy_pass http://127.0.0.1:5000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_key {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /drop/ws {
        proxy_pass http://127.0.0.1:8090/drop/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /drop/ {
        proxy_pass http://127.0.0.1:8090/drop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 205M;
    }

    location /todo-api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /asteroids/ws {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /asteroids/ {
        proxy_pass http://127.0.0.1:8082/asteroids/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /todo-app/share {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:5003/share;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/todo-app/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|manifest\.json|version\.json)$ {
        alias /home/epatel/vps-ai/projects/todo-app/build/web/$1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location /todo-app/ {
        client_max_body_size 20M;
        alias /home/epatel/vps-ai/projects/todo-app/build/web/;
        index index.html;
        try_files $uri $uri/ /todo-app/index.html;
    }

    location /trumps48hours/ {
        alias /home/epatel/vps-ai/projects/trumps48hours/;
        index index.html;
        try_files $uri $uri/ /trumps48hours/index.html;
    }

    # discrete6502 board navigator — reads are public, writes need the token.
    location = /d6502navigator { return 301 /d6502navigator/; }

    location /d6502navigator/ws {
        proxy_pass http://127.0.0.1:8624/d6502navigator/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /d6502navigator/ {
        proxy_pass http://127.0.0.1:8624/d6502navigator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip off;                      # the board renders are PNG already
    }

    location /quiz/ws {
        proxy_pass http://127.0.0.1:8092/quiz/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /quiz/ {
        proxy_pass http://127.0.0.1:8092/quiz/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /setup {        alias /home/epatel/vps-ai/projects/landing/setup;        default_type text/plain;    }
    location ~ ^/cards/?$ {
        return 302 /cards/cards-instructions.md;
    }

    location /cards/ {
        alias /home/epatel/vps-ai/projects/landing/cards/;
        default_type text/plain;
    }
    include /home/epatel/sl-chat/deploy/sl-chat.nginx.conf;
    include /home/epatel/sl-mcp/deploy/sl-mcp.nginx.conf;
    include /home/epatel/wcag_checker_frontend/deploy/wcag_checker.nginx.conf;
    # --- kanban-demo (Doodle Together): FastAPI + WebSocket drawing app ---
    # App is mounted UNDER /kanban-demo internally, so forward the full path
    # unchanged (proxy_pass without a URI part = no prefix stripping).
    location = /kanban-demo { return 301 /kanban-demo/; }

    # WebSocket route is /kanban-demo/rooms/<slug>/ws
    location ~ ^/kanban-demo/.+/ws$ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /kanban-demo/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- calender (issue #122): static print-friendly month calendar ---
    location = /calendar { return 301 /calender/; }
    location /calendar/ { return 301 /calender/; }
    location = /calender { return 301 /calender/; }

    location /calender/ {
        alias /home/epatel/vps-ai/projects/calender/;
        index index.html;
    }

    # --- newsletter: daily AI news by email (FastAPI + SQLite) ---
    # App is mounted UNDER /newsletter internally, so forward the full path
    # unchanged (proxy_pass without a URI part = no prefix stripping).
    location = /newsletter { return 301 /newsletter/; }

    location /newsletter/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /admin/run-today drives a workflow run that can take many minutes.
        proxy_read_timeout 1800;
    }

    location /tuesday/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /admin/run-today can wait out fetch retries (FETCH_ATTEMPTS x FETCH_RETRY_SECONDS).
        proxy_read_timeout 1800;
    }

    location / {
        alias /home/epatel/vps-ai/projects/landing/;
        index index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai.memention.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.memention.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include /home/epatel/luni-demo/nginx-symbol-select-demo.conf;
}
server {
    if ($host = ai.memention.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ai.memention.net;
    return 404; # managed by Certbot


}
